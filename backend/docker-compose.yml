# Local Postgres + Redis for development.
#
#   docker compose up -d        # start (waits for healthchecks with --wait)
#   docker compose down         # stop (data is kept in named volumes)
#   docker compose down -v      # stop and wipe all data
#
# Values come from .env (same file the app reads) — keep POSTGRES_* in sync with
# DATABASE_URL and REDIS_PORT with REDIS_URL. See .env.example.

name: toshi

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toshi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toshi}
      POSTGRES_DB: ${POSTGRES_DB:-toshi_db}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence so revoked refresh tokens / locks survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
